name: Release

# Builds ReportMate.app on a version tag, wraps it as an UNSIGNED
# ReportMate-<version>.pkg (app to /Applications, bundled reportmate CLI linked
# into /usr/local/bin) and ReportMate-<version>.dmg, and publishes both as a
# GitHub release. Apple Developer ID material is intentionally NOT held here:
# the artifacts ship unsigned and are signed and notarized downstream, the way
# reportmate-client-mac's runner pkg is.

on:
  push:
    tags:
      - 'v*'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leave empty for auto YYYY.MM.DD.HHMM)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}

      - name: Resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$'; then
            VERSION="$(date +%Y.%m.%d.%H%M)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app, pkg and dmg
        run: scripts/build-app.sh --version=${{ steps.resolve.outputs.version }} --pkg --dmg

      - name: Capture build info
        id: info
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd .build/app
          # The unsigned app on its own, for downstream pipelines that sign and
          # wrap it themselves (the Munki build-import package sources this zip).
          ditto -c -k --keepParent ReportMate.app "ReportMate-App-$VERSION.zip"
          ls -1 "ReportMate-$VERSION.pkg" "ReportMate-$VERSION.dmg" "ReportMate-App-$VERSION.zip"
          shasum -a 256 "ReportMate-$VERSION.pkg" "ReportMate-$VERSION.dmg" "ReportMate-App-$VERSION.zip" > "ReportMate-$VERSION.sha256"
          CLI_VERSION="$(ReportMate.app/Contents/Helpers/reportmate --version 2>/dev/null | head -1 || echo unknown)"
          {
            echo "cli=$CLI_VERSION"
            echo "swift=$(swift --version 2>&1 | head -1)"
            echo "os=$(sw_vers -productName) $(sw_vers -productVersion)"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
          CLI: ${{ steps.info.outputs.cli }}
          SWIFT: ${{ steps.info.outputs.swift }}
          OS: ${{ steps.info.outputs.os }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$VERSION"
          else
            TAG="$REF_NAME"
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          AUTO_NOTES=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body || true)
          AUTO_NOTES=$(printf '%s\n' "$AUTO_NOTES" | sed -E -e 's/ by @[A-Za-z0-9_-]+ in / in /g' -e '/^#+ New Contributors/d' -e '/made their first contribution/d')
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          {
            printf '## Build info\n\n'
            printf 'Built with %s on %s, via %s. Bundles the reportmate command line tool (%s). Provided **unsigned**.\n\n' \
              "$SWIFT" "$OS" "$RUN_URL" "$CLI"
            printf '%s\n\n' "$AUTO_NOTES"
            printf '%s\n' '## Install'
            printf '%s\n' ''
            printf '%s\n' 'The pkg installs ReportMate.app into /Applications and links the bundled tool to'
            printf '%s\n' '/usr/local/bin/reportmate. The dmg carries the app alone.'
            printf '%s\n' ''
            printf '%s\n' '## Signing for enterprise deployment'
            printf '%s\n' ''
            printf '%s\n' 'Sign and notarize before distribution. The tool inside the bundle is signed first:'
            printf '%s\n' ''
            printf '%s\n' '```bash'
            printf '%s\n' 'codesign --force --options runtime --timestamp \'
            printf '%s\n' '  --sign "Developer ID Application: <Org> (<TeamID>)" \'
            printf '%s\n' '  /Applications/ReportMate.app/Contents/Helpers/reportmate'
            printf '%s\n' 'codesign --force --deep --options runtime --timestamp \'
            printf '%s\n' '  --sign "Developer ID Application: <Org> (<TeamID>)" /Applications/ReportMate.app'
            printf '%s\n' ''
            printf '%s\n' 'productsign --timestamp \'
            printf '%s\n' '  --sign "Developer ID Installer: <Org> (<TeamID>)" \'
            printf '%s\n' '  ReportMate-<version>.pkg ReportMate-<version>-signed.pkg'
            printf '%s\n' ''
            printf '%s\n' 'xcrun notarytool submit ReportMate-<version>-signed.pkg \'
            printf '%s\n' '  --apple-id <apple-id> --team-id <TeamID> --password <app-specific-password> --wait'
            printf '%s\n' 'xcrun stapler staple ReportMate-<version>-signed.pkg'
            printf '%s\n' '```'
          } > "$NOTES_FILE"
          cd .build/app
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" "ReportMate-$VERSION.pkg" "ReportMate-$VERSION.dmg" "ReportMate-App-$VERSION.zip" "ReportMate-$VERSION.sha256" \
              --target "$GITHUB_SHA" --title "ReportMate for Mac $VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "ReportMate-$VERSION.pkg" "ReportMate-$VERSION.dmg" "ReportMate-App-$VERSION.zip" "ReportMate-$VERSION.sha256" \
              --title "ReportMate for Mac $VERSION" --notes-file "$NOTES_FILE"
          fi
