name: Release

# Builds ReportMate.app on a version tag, signs it with a Developer ID, wraps it
# as ReportMate-<version>.pkg (app to /Applications, bundled reportmate CLI
# linked into /usr/local/bin) and ReportMate-<version>.dmg, notarizes and
# staples both, and publishes them as a GitHub release.
#
# The signing identity comes only from repository secrets; build-app.sh reads
# it from the environment, so a build from source signs with its builder's own.

on:
  push:
    tags:
      - 'v*'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leave empty for auto YYYY.MM.DD.HHMM)'
        required: false
        type: string
      publish:
        description: 'Publish a GitHub release. Off = build, sign and notarize only, as a dry run.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # Notarization for a young team can sit in Apple's queue for over an hour.
    timeout-minutes: 330
    env:
      NOTARIZATION_PROFILE: notary

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}

      - name: Resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$'; then
            VERSION="$(date +%Y.%m.%d.%H%M)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificates
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certs.p12"

      - name: Store notarization credentials
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$key"
          xcrun notarytool store-credentials "$NOTARIZATION_PROFILE" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN"
          rm "$key"

      - name: Build and sign app, pkg and dmg
        env:
          SIGNING_IDENTITY_APP: ${{ secrets.SIGNING_IDENTITY_APP }}
          SIGNING_IDENTITY_INSTALLER: ${{ secrets.SIGNING_IDENTITY_INSTALLER }}
        run: scripts/build-app.sh --version=${{ steps.resolve.outputs.version }} --sign --pkg --dmg

      # The pkg and dmg are submitted together and polled together, with a
      # status line every 30 seconds. Once Apple has accepted them the app's own
      # ticket exists too, so the bare app is stapled before it is zipped.
      - name: Notarize and staple
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd .build/app
          nt() { xcrun notarytool "$@" --keychain-profile "$NOTARIZATION_PROFILE" --keychain "$KEYCHAIN"; }
          pkg="ReportMate-$VERSION.pkg"; dmg="ReportMate-$VERSION.dmg"
          pkg_id=$(nt submit "$pkg" --output-format json | jq -r .id); echo "Submitted $pkg as $pkg_id"
          dmg_id=$(nt submit "$dmg" --output-format json | jq -r .id); echo "Submitted $dmg as $dmg_id"
          deadline=$((SECONDS + 5 * 3600))
          while :; do
            pending=0
            for pair in "$pkg:$pkg_id" "$dmg:$dmg_id"; do
              f=${pair%%:*}; id=${pair##*:}
              status=$(nt info "$id" --output-format json | jq -r .status)
              echo "$(date -u +%H:%M:%S) $f $status"
              case "$status" in
                Accepted) ;;
                Invalid|Rejected) nt log "$id"; exit 1 ;;
                *) pending=1 ;;
              esac
            done
            [ "$pending" = 0 ] && break
            if [ "$SECONDS" -gt "$deadline" ]; then
              echo "::error::Notarization still pending after 5 hours: pkg $pkg_id, dmg $dmg_id"
              exit 1
            fi
            sleep 30
          done
          for f in "ReportMate-$VERSION.pkg" "ReportMate-$VERSION.dmg" ReportMate.app; do
            xcrun stapler staple "$f"
          done
          spctl -a -vvv -t install "ReportMate-$VERSION.pkg"
          spctl -a -vvv -t exec ReportMate.app

      - name: Capture build info
        id: info
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd .build/app
          # The signed, stapled app on its own, for anyone packaging it themselves.
          # A pipeline that re-signs it with its own identity still can.
          ditto -c -k --keepParent ReportMate.app "ReportMate-App-$VERSION.zip"
          ls -1 "ReportMate-$VERSION.pkg" "ReportMate-$VERSION.dmg" "ReportMate-App-$VERSION.zip"
          shasum -a 256 "ReportMate-$VERSION.pkg" "ReportMate-$VERSION.dmg" "ReportMate-App-$VERSION.zip" > "ReportMate-$VERSION.sha256"
          CLI_VERSION="$(ReportMate.app/Contents/Helpers/reportmate --version 2>/dev/null | head -1 || echo unknown)"
          {
            echo "cli=$CLI_VERSION"
            echo "swift=$(swift --version 2>&1 | head -1)"
            echo "os=$(sw_vers -productName) $(sw_vers -productVersion)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ReportMate-${{ steps.resolve.outputs.version }}
          path: |
            .build/app/ReportMate-*.pkg
            .build/app/ReportMate-*.dmg
            .build/app/ReportMate-App-*.zip
            .build/app/ReportMate-*.sha256

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
          CLI: ${{ steps.info.outputs.cli }}
          SWIFT: ${{ steps.info.outputs.swift }}
          OS: ${{ steps.info.outputs.os }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$VERSION"
          else
            TAG="$REF_NAME"
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          AUTO_NOTES=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body || true)
          AUTO_NOTES=$(printf '%s\n' "$AUTO_NOTES" | sed -E -e 's/ by @[A-Za-z0-9_-]+ in / in /g' -e '/^#+ New Contributors/d' -e '/made their first contribution/d')
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          {
            printf '## Build info\n\n'
            printf 'Built with %s on %s, via %s. Bundles the reportmate command line tool (%s). Signed with a Developer ID and notarized by Apple.\n\n' \
              "$SWIFT" "$OS" "$RUN_URL" "$CLI"
            printf '%s\n\n' "$AUTO_NOTES"
            printf '%s\n' '## Install'
            printf '%s\n' ''
            printf '%s\n' 'The pkg installs ReportMate.app into /Applications and links the bundled tool to'
            printf '%s\n' '/usr/local/bin/reportmateutil. The dmg carries the app alone. The App zip is the'
            printf '%s\n' 'bare signed bundle for pipelines that package it themselves.'
            printf '%s\n' ''
            printf '%s\n' '## Signing with your own Developer ID'
            printf '%s\n' ''
            printf '%s\n' 'Build from source with scripts/build-app.sh --sign: it reads SIGNING_IDENTITY_APP'
            printf '%s\n' 'and SIGNING_IDENTITY_INSTALLER from .env and signs with whatever identity you give it.'
          } > "$NOTES_FILE"
          cd .build/app
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" "ReportMate-$VERSION.pkg" "ReportMate-$VERSION.dmg" "ReportMate-App-$VERSION.zip" "ReportMate-$VERSION.sha256" \
              --target "$GITHUB_SHA" --title "ReportMate for Mac $VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "ReportMate-$VERSION.pkg" "ReportMate-$VERSION.dmg" "ReportMate-App-$VERSION.zip" "ReportMate-$VERSION.sha256" \
              --title "ReportMate for Mac $VERSION" --notes-file "$NOTES_FILE"
          fi
