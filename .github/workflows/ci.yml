name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}

      - name: Test the kit
        run: swift test

      - name: Build the app bundle and installer
        run: scripts/build-app.sh --pkg

      # Unsigned artifacts on every push and pull request, so a PR proves the
      # bundle (app plus reportmateutil) builds; the private pipelines sign them.
      - name: Zip the app
        run: cd .build/app && ditto -c -k --keepParent ReportMate.app ReportMate.app.zip

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReportMate-unsigned-${{ github.sha }}
          path: |
            .build/app/ReportMate.app.zip
            .build/app/ReportMate-*.pkg
          if-no-files-found: error
          retention-days: 14
